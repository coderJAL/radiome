<!doctype html>
<html lang="ml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a12">
  <title>Radio Me — ഇഷ്ടംപോലെ പാട്ട്</title>
  <meta name="description" content="Radio Me — ഇഷ്ടംപോലെ പാട്ട്. Listen to Radio Me promos and songs.">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&family=Outfit:wght@400;500;600;700;800&display=swap');
    :root{--bg:#070811;--card:rgba(19,21,34,.78);--card2:#111422;--text:#f7f7fb;--muted:#9ea4b8;--line:rgba(255,255,255,.09);--accent:#ff4f9a;--accent2:#7b61ff;--good:#55e6a5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--text);font-family:Outfit,Manjari,system-ui,sans-serif;background:
      radial-gradient(circle at 15% 10%,rgba(255,79,154,.20),transparent 32%),
      radial-gradient(circle at 85% 20%,rgba(123,97,255,.22),transparent 35%),
      linear-gradient(135deg,#060710,#0c0d18 55%,#080914);overflow-x:hidden}
    .wrap{width:min(1120px,92%);margin:auto;padding:30px 0 42px}
    header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:26px}
    .brand{display:flex;align-items:center;gap:14px}
    .brand img{width:58px;height:58px;border-radius:17px;object-fit:cover;box-shadow:0 10px 35px rgba(0,0,0,.4)}
    .brand h1{margin:0;font-size:25px;letter-spacing:.02em}.brand p{margin:2px 0 0;color:#c8cada;font-family:Manjari,sans-serif;font-size:15px}
    .live{display:flex;align-items:center;gap:8px;border:1px solid rgba(85,230,165,.25);background:rgba(85,230,165,.08);padding:8px 12px;border-radius:999px;color:#b9f8db;font-size:12px;font-weight:700;letter-spacing:.12em}
    .dot{width:8px;height:8px;background:var(--good);border-radius:50%;box-shadow:0 0 12px var(--good);animation:pulse 1.5s infinite}@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
    .grid{display:grid;grid-template-columns:1.02fr .98fr;gap:22px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:0 25px 70px rgba(0,0,0,.28);backdrop-filter:blur(20px)}
    .player{padding:30px}
    .art{position:relative;aspect-ratio:1/1;border-radius:22px;overflow:hidden;background:#171928;margin-bottom:25px;box-shadow:0 25px 60px rgba(0,0,0,.35)}
    .art:after{content:"";position:absolute;inset:0;background:linear-gradient(145deg,transparent 40%,rgba(0,0,0,.55));pointer-events:none}
    .art img{width:100%;height:100%;object-fit:cover}
    .art .equal{position:absolute;z-index:2;left:18px;bottom:18px;display:flex;gap:4px;align-items:end;height:25px}
    .equal i{width:4px;border-radius:5px;background:#fff;height:9px;animation:eq .8s ease-in-out infinite alternate}.equal i:nth-child(2){height:18px;animation-delay:.15s}.equal i:nth-child(3){height:12px;animation-delay:.3s}.equal i:nth-child(4){height:22px;animation-delay:.45s}
    .paused .equal i{animation-play-state:paused;opacity:.5}@keyframes eq{to{height:24px}}
    .now{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.16em;margin-bottom:6px}.title{font-size:28px;font-weight:700;margin:0 0 4px;line-height:1.15}.artist{color:#b0b5c7;margin-bottom:22px}
    .range{width:100%;accent-color:var(--accent);cursor:pointer}.times{display:flex;justify-content:space-between;color:#777d93;font-size:11px;margin-top:6px}
    .controls{display:flex;justify-content:center;align-items:center;gap:14px;margin:20px 0}.ctrl{width:45px;height:45px;border:1px solid var(--line);border-radius:50%;background:#161827;color:white;cursor:pointer;font-size:17px;transition:.2s}.ctrl:hover{transform:translateY(-2px);background:#202237}.play{width:66px;height:66px;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:23px;box-shadow:0 10px 30px rgba(255,79,154,.25)}
    .volume{display:flex;align-items:center;gap:10px;color:#a5aabd;font-size:15px}.volume input{flex:1;accent-color:#9b7cff}
    .playlist{padding:25px}
    .playlist-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:16px}.playlist h2{font-size:20px;margin:0}.count{color:#7e8499;font-size:12px}
    .list{display:flex;flex-direction:column;gap:8px;max-height:620px;overflow:auto;padding-right:4px}.item{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:16px;border:1px solid transparent;cursor:pointer;transition:.2s}.item:hover{background:rgba(255,255,255,.045)}.item.active{background:linear-gradient(90deg,rgba(255,79,154,.12),rgba(123,97,255,.08));border-color:rgba(255,255,255,.08)}
    .num{width:42px;height:42px;border-radius:12px;background:#191b2a;display:grid;place-items:center;color:#8f95aa;font-size:13px}.item.active .num{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.meta{min-width:0}.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.type{font-size:11px;color:#7e8498;margin-top:3px}.playmini{color:#7e8498;font-size:13px}
    footer{text-align:center;color:#62687b;font-size:12px;margin-top:22px}.mal{font-family:Manjari,sans-serif}
    @media(max-width:820px){.grid{grid-template-columns:1fr}.art{max-width:520px;margin-inline:auto;margin-bottom:22px}.player{padding:22px}.playlist{padding:20px}}
    @media(max-width:500px){.wrap{padding-top:18px}.brand img{width:48px;height:48px}.brand h1{font-size:21px}.live{padding:7px 9px}.live span:last-child{display:none}.title{font-size:24px}.card{border-radius:22px}.list{max-height:none}.item{grid-template-columns:38px 1fr auto}.num{width:38px;height:38px}}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="https://blogger.googleusercontent.com/img/a/AVvXsEjwo9fPoph5mleAENDxe-NSmQ8TAxFB-n1bZFATsnrzfHp6IexLXoL1D7bNrJd7s8CdzHzoWCXGncE_ke80Uo9RuqLHVPDDoxDr96j0YssTz9Krv0scz9AHB9rqwnEYlX6bkS9cIPnKdWgP_p7LscZnydf7Rb2XPa88oz0cYiuHw9PPzaFx7ZtxhZGb=w200-h199" alt="Radio Me logo">
      <div><h1>Radio Me</h1><p>ഇഷ്ടംപോലെ പാട്ട്</p></div>
    </div>
    <div class="live"><i class="dot"></i><span>RADIO ME</span><span>ON AIR</span></div>
  </header>

  <main class="grid">
    <section class="card player">
      <div class="art paused" id="art">
        <img id="cover" src="https://blogger.googleusercontent.com/img/a/AVvXsEjwo9fPoph5mleAENDxe-NSmQ8TAxFB-n1bZFATsnrzfHp6IexLXoL1D7bNrJd7s8CdzHzoWCXGncE_ke80Uo9RuqLHVPDDoxDr96j0YssTz9Krv0scz9AHB9rqwnEYlX6bkS9cIPnKdWgP_p7LscZnydf7Rb2XPa88oz0cYiuHw9PPzaFx7ZtxhZGb=w200-h199" alt="">
        <div class="equal"><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="now">Now playing</div>
      <h2 class="title" id="title">Radio Me Promo 1</h2>
      <div class="artist" id="artist">Radio Me</div>
      <input class="range" id="seek" type="range" min="0" max="100" value="0" aria-label="Seek">
      <div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div>
      <div class="controls">
        <button class="ctrl" id="prev" aria-label="Previous">↶</button>
        <button class="ctrl play" id="play" aria-label="Play">▶</button>
        <button class="ctrl" id="next" aria-label="Next">↷</button>
      </div>
      <div class="volume">🔊 <input id="volume" type="range" min="0" max="1" step=".01" value=".85" aria-label="Volume"></div>
      <audio id="audio" preload="metadata"></audio>
    </section>

    <section class="card playlist">
      <div class="playlist-head"><div><h2>Playlist</h2><div class="count">Promo + Radio Me songs</div></div></div>
      <div class="list" id="list"></div>
    </section>
  </main>
  <footer><span class="mal">റേഡിയോ മീ — നിങ്ങളുടെ സ്വന്തം സംഗീത കൂട്ടുകാരൻ</span> · Radio Me</footer>
</div>

<script>
const logo = "https://blogger.googleusercontent.com/img/a/AVvXsEjwo9fPoph5mleAENDxe-NSmQ8TAxFB-n1bZFATsnrzfHp6IexLXoL1D7bNrJd7s8CdzHzoWCXGncE_ke80Uo9RuqLHVPDDoxDr96j0YssTz9Krv0scz9AHB9rqwnEYlX6bkS9cIPnKdWgP_p7LscZnydf7Rb2XPa88oz0cYiuHw9PPzaFx7ZtxhZGb=w200-h199";
const tracks = [
  ["Radio Me Promo 1","Promo","https://raw.githubusercontent.com/Rmedialive/audio/master/Promo/promo1.wav"],
  ["Radio Me Promo 2","Promo","https://raw.githubusercontent.com/Rmedialive/audio/master/Promo/promo2.wav"],
  ["Radio Me (1)","Radio Me Song","https://raw.githubusercontent.com/Rmedialive/audio/master/Promo-Songs/Radio-me(1).wav"],
  ["Radio Me (2)","Radio Me Song","https://raw.githubusercontent.com/Rmedialive/audio/master/Promo-Songs/Radio-me(2).wav"],
  ["Radio Me (3)","Radio Me Song","https://raw.githubusercontent.com/Rmedialive/audio/master/Promo-Songs/Radio-me(3).wav"],
  ["Radio Me (4)","Radio Me Song","https://raw.githubusercontent.com/Rmedialive/audio/master/Promo-Songs/Radio-me(4).wav"],
  ["Radio Me (5)","Radio Me Song","https://raw.githubusercontent.com/Rmedialive/audio/master/Promo-Songs/Radio-me(5).wav"],
  ["Radio Me (6)","Radio Me Song","https://raw.githubusercontent.com/Rmedialive/audio/master/Promo-Songs/Radio-me(6).wav"],
  ["Radio Me (7)","Radio Me Song","https://raw.githubusercontent.com/Rmedialive/audio/master/Promo-Songs/Radio-me(7).wav"],
  ["Radio Me (9)","Radio Me Song","https://raw.githubusercontent.com/Rmedialive/audio/master/Promo-Songs/Radio-me(9).wav"],
  ["Radio Me (10)","Radio Me Song","https://raw.githubusercontent.com/Rmedialive/audio/master/Promo-Songs/Radio-me(10).wav"],
  ["Radio Me (11)","Radio Me Song","https://raw.githubusercontent.com/Rmedialive/audio/master/Promo-Songs/Radio-me(11).wav"],
  ["Radio Me (12)","Radio Me Song","https://raw.githubusercontent.com/Rmedialive/audio/master/Promo-Songs/Radio-me(12).wav"]
];

const audio=document.getElementById("audio"), list=document.getElementById("list"), play=document.getElementById("play");
const title=document.getElementById("title"), artist=document.getElementById("artist"), seek=document.getElementById("seek");
const current=document.getElementById("current"), duration=document.getElementById("duration"), art=document.getElementById("art");
let index=0;

function fmt(s){if(!isFinite(s))return "0:00";let m=Math.floor(s/60), sec=Math.floor(s%60);return `${m}:${String(sec).padStart(2,"0")}`}
function render(){
  list.innerHTML="";
  tracks.forEach((t,i)=>{
    const el=document.createElement("div"); el.className="item"+(i===index?" active":"");
    el.innerHTML=`<div class="num">${String(i+1).padStart(2,"0")}</div><div class="meta"><div class="name">${t[0]}</div><div class="type">${t[1]}</div></div><div class="playmini">${i===index && !audio.paused?"●":"▶"}</div>`;
    el.onclick=()=>load(i,true); list.appendChild(el);
  });
}
function load(i,autoplay=false){
  index=(i+tracks.length)%tracks.length;
  const t=tracks[index]; audio.src=t[2]; title.textContent=t[0]; artist.textContent=t[1];
  seek.value=0; current.textContent="0:00"; duration.textContent="0:00"; render();
  if(autoplay) audio.play().catch(()=>{});
}
function update(){
  seek.value=audio.duration?(audio.currentTime/audio.duration)*100:0;
  current.textContent=fmt(audio.currentTime); duration.textContent=fmt(audio.duration);
  play.textContent=audio.paused?"▶":"Ⅱ"; art.classList.toggle("paused",audio.paused); render();
}
play.onclick=()=>audio.paused?audio.play():audio.pause();
document.getElementById("prev").onclick=()=>load(index-1,true);
document.getElementById("next").onclick=()=>load(index+1,true);
seek.oninput=()=>{if(audio.duration)audio.currentTime=(seek.value/100)*audio.duration};
document.getElementById("volume").oninput=e=>audio.volume=e.target.value;
audio.volume=.85; audio.addEventListener("timeupdate",update); audio.addEventListener("loadedmetadata",update);
audio.addEventListener("play",update); audio.addEventListener("pause",update); audio.addEventListener("ended",()=>load(index+1,true));
audio.addEventListener("error",()=>{title.textContent="Unable to play this track"; artist.textContent="Try another item from the playlist.";});
load(0,false);
</script>
</body>
</html>
